name: Publish Android internal

# Manual dispatch only. Does not run on push.
# Required repository secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON,
#   EXPO_PUBLIC_CDP_PROJECT_ID, EXPO_PUBLIC_BASE_URL,
#   EXPO_PUBLIC_ANDROID_CLOUD_PROJECT_NUMBER
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      EXPO_PUBLIC_CDP_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_CDP_PROJECT_ID }}
      EXPO_PUBLIC_ONRAMP_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_ONRAMP_PROJECT_ID }}
      EXPO_PUBLIC_APP_ATTEST_APP_ID: ${{ secrets.EXPO_PUBLIC_APP_ATTEST_APP_ID }}
      EXPO_PUBLIC_BASE_URL: ${{ secrets.EXPO_PUBLIC_BASE_URL }}
      EXPO_PUBLIC_APP2APP_REDIRECT_URL: ${{ secrets.EXPO_PUBLIC_APP2APP_REDIRECT_URL }}
      EXPO_PUBLIC_ANDROID_CLOUD_PROJECT_NUMBER: ${{ secrets.EXPO_PUBLIC_ANDROID_CLOUD_PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: android-actions/setup-android@v3

      - name: Require publish secrets
        run: bash tools/android-publish/check-android-publish-secrets.sh

      - name: Install dependencies
        run: npm ci

      - name: Write build-time env
        run: bash tools/android-publish/write-android-publish-env.sh

      - name: Prebuild Android
        run: npx expo prebuild -p android --non-interactive

      - name: Sign and build the release bundle
        run: bash tools/android-publish/build-android-release-bundle.sh

      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.coinbase.cdp_onramp
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
